# =============================================================================
# Copie de test LOCALE de home_energy_management.yaml : identique, mais les
# packages et le composant esmart3 sont pris dans ce dépôt (!include / local)
# au lieu d'être téléchargés depuis GitHub. Sert à valider/compiler des modifs
# de packages/* et components/esmart3 AVANT de les pousser.
#   python -m esphome config local-test.yaml
#   python -m esphome run local-test.yaml --device <ip>
# Duplique la partie board/pins de home_energy_management.yaml : répercuter
# tout changement de pins/board dans les deux fichiers.
# =============================================================================

substitutions:
  name: hem-esphome
  friendly_name: "Home Energy Management"

  mppt_rx_pin: "16"
  mppt_tx_pin: "17"
  mppt_de_pin: "4"
  pzem_rx_pin: "13"
  pzem_tx_pin: "14"
  i2c_sda_pin: "21"
  i2c_scl_pin: "22"
  relay_1_pin: "25"
  relay_2_pin: "26"
  relay_3_pin: "27"
  relay_4_pin: "32"
  input_1_pin: "33"
  input_2_pin: "34"
  input_3_pin: "35"
  input_4_pin: "36"
  status_led_pin: "2"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(mppt2_energy_offset) = id(nvs_mppt2_energy);

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [esmart3]
  - source: github://syssi/esphome-jbd-bms@main
    refresh: 0s

packages:
  wifi: !include packages/wifi.yaml
  mqtt: !include packages/mqtt.yaml
  system: !include packages/system.yaml
  gpio: !include packages/gpio.yaml
  pzem: !include packages/pzem.yaml
  mppt_esmart3: !include packages/mppt_esmart3.yaml
  jbd_bms_ble: !include packages/jbd_bms_ble.yaml
  battery_protection: !include packages/battery_protection.yaml
  energy: !include packages/energy.yaml
  mppt2_shunt: !include packages/mppt2_shunt.yaml

logger:
  level: INFO
